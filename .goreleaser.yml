# GoReleaser configuration for Sarge
# See: https://goreleaser.com/customization/

version: 2

project_name: sarge

before:
  hooks:
    - go mod tidy

builds:
  - id: sarge
    main: .
    binary: sarge
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.ShortCommit}}
      - -X main.date={{.Date}}

archives:
  - id: sarge
    builds:
      - sarge
    format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE*
      - README*

checksum:
  name_template: "checksums.txt"

changelog:
  disable: true

release:
  disable: true
